---
- name: un-install
  tags: [role-un-install]
  block:

  # assert
  - name: Assertions for un-install role
    ansible.builtin.assert:
      that:
      - un_install_app != ""
      - un_install_user != ""
      quiet: true

  # make sure user exists
  - name: Check if user exists {{ un_install_user }}
    command: "getent passwd {{ un_install_user }}"
    changed_when: false

  - ansible.builtin.import_tasks: un-install-app.yml
  - ansible.builtin.import_tasks: un-install-env.yml
  - ansible.builtin.import_tasks: un-install-exec-link.yml
  - ansible.builtin.import_tasks: un-install-desktop.yml
  - ansible.builtin.import_tasks: un-install-polkit.yml
  - ansible.builtin.import_tasks: un-install-systemd.yml

  # systemd_unit
  - tags: [role-un-install-systemd-units]
    name: Configure systemd units
    ansible.builtin.include_tasks: un-install-systemd-unit.yml
    loop: "{{ un_install_systemd_units }}"
    loop_control:
      loop_var: item
      label: "{{ item.name }}"